name: Build Rust Hook Binaries

on:
  push:
    paths:
      - 'hooks/rust/tdq-dispatch/**'
      - '.github/workflows/build-rust-hooks.yml'
  pull_request:
    paths:
      - 'hooks/rust/tdq-dispatch/**'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_src: hooks/rust/tdq-dispatch/target/x86_64-pc-windows-msvc/release/tdq-dispatch.exe
            binary_name: tdq-dispatch.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_src: hooks/rust/tdq-dispatch/target/x86_64-unknown-linux-musl/release/tdq-dispatch
            binary_name: tdq-dispatch-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_src: hooks/rust/tdq-dispatch/target/aarch64-apple-darwin/release/tdq-dispatch
            binary_name: tdq-dispatch-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --manifest-path hooks/rust/tdq-dispatch/Cargo.toml --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_src }}
          if-no-files-found: error
