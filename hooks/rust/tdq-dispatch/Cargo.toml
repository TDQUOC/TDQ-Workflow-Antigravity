[package]
name = "tdq-dispatch"
version = "0.108.0"
edition = "2021"
authors = ["TDQ Workflow Team"]
description = "High-performance standalone hook dispatcher for Antigravity"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
